spring.application.name=reuniones
server.port=8082
spring.config.import=optional:file:.env[.properties],optional:file:reuniones/.env[.properties]

# Configuracion por entorno (local por defecto)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/reuniones?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=${JPA_SHOW_SQL:true}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true
springdoc.swagger-ui.path=/reuniones.html
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.operations-sorter=alpha
springdoc.api-docs.enabled=true
