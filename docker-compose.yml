version: '3.8'

services:

  mysql:
    image: mysql:8.0
    container_name: sigedu-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: identidad
    ports:
      - "3307:3306"
    volumes:
      - sigedu-mysql-data:/var/lib/mysql
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    networks:
      - sigedu-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-root}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  identidad:
    build: ./identidad
    container_name: sigedu-identidad
    ports:
      - "8080:8080"
    environment:
      SERVER_PORT: 8080
      DB_URL: jdbc:mysql://mysql:3306/identidad?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
      DB_USER: root
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-me-32-bytes-minimum}
      JWT_EXPIRATION: 86400000
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - sigedu-network

  academica:
    build: ./academica
    container_name: sigedu-academica
    ports:
      - "8083:8083"
    environment:
      SERVER_PORT: 8083
      DB_URL: jdbc:mysql://mysql:3306/academica?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
      DB_USER: root
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      IDENTIDAD_URL: http://identidad:8080
    depends_on:
      mysql:
        condition: service_healthy
      identidad:
        condition: service_started
    networks:
      - sigedu-network

  geografia:
    build: ./geografia
    container_name: sigedu-geografia
    ports:
      - "8086:8086"
    environment:
      SERVER_PORT: 8086
      DB_URL: jdbc:mysql://mysql:3306/geografia?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
      DB_USER: root
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      IDENTIDAD_URL: http://identidad:8080
    depends_on:
      mysql:
        condition: service_healthy
      identidad:
        condition: service_started
    networks:
      - sigedu-network

  reuniones:
    build: ./reuniones
    container_name: sigedu-reuniones
    ports:
      - "8082:8082"
    environment:
      SERVER_PORT: 8082
      DB_URL: jdbc:mysql://mysql:3306/reuniones?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
      DB_USER: root
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      IDENTIDAD_URL: http://identidad:8080
      MATRICULA_URL: http://matricula:8088
    depends_on:
      mysql:
        condition: service_healthy
      identidad:
        condition: service_started
      matricula:
        condition: service_started
    networks:
      - sigedu-network

  convivencia:
    build: ./convivencia
    container_name: sigedu-convivencia
    ports:
      - "8085:8085"
    environment:
      SERVER_PORT: 8085
      DB_URL: jdbc:mysql://mysql:3306/convivencia?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
      DB_USER: root
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      IDENTIDAD_URL: http://identidad:8080
      MATRICULA_URL: http://matricula:8088
    depends_on:
      mysql:
        condition: service_healthy
      identidad:
        condition: service_started
      matricula:
        condition: service_started
    networks:
      - sigedu-network

  calendario:
    build: ./calendario
    container_name: sigedu-calendario
    ports:
      - "8084:8084"
    environment:
      SERVER_PORT: 8084
      DB_URL: jdbc:mysql://mysql:3306/calendario?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
      DB_USER: root
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      IDENTIDAD_URL: http://identidad:8080
    depends_on:
      mysql:
        condition: service_healthy
      identidad:
        condition: service_started
    networks:
      - sigedu-network

  notas:
    build: ./notas
    container_name: sigedu-notas
    ports:
      - "8090:8090"
    environment:
      SERVER_PORT: 8090
      DB_URL: jdbc:mysql://mysql:3306/notas?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
      DB_USER: root
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      IDENTIDAD_URL: http://identidad:8080
      GESTION_ACADEMICA_URL: http://gestionacademica:8087
      MATRICULA_URL: http://matricula:8088
    depends_on:
      mysql:
        condition: service_healthy
      identidad:
        condition: service_started
      gestionacademica:
        condition: service_started
      matricula:
        condition: service_started
    networks:
      - sigedu-network

  gestionacademica:
    build: ./gestionacademica
    container_name: sigedu-gestionacademica
    ports:
      - "8087:8087"
    environment:
      SERVER_PORT: 8087
      DB_URL: jdbc:mysql://mysql:3306/gestionacademica?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
      DB_USER: root
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      IDENTIDAD_URL: http://identidad:8080
      MS_ACADEMICA_URL: http://academica:8083
    depends_on:
      mysql:
        condition: service_healthy
      identidad:
        condition: service_started
      academica:
        condition: service_started
    networks:
      - sigedu-network

  matricula:
    build: ./matricula
    container_name: sigedu-matricula
    ports:
      - "8088:8088"
    environment:
      SERVER_PORT: 8088
      DB_URL: jdbc:mysql://mysql:3306/matricula?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
      DB_USER: root
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      IDENTIDAD_URL: http://identidad:8080
      MS_ACADEMICA_URL: http://academica:8083
    depends_on:
      mysql:
        condition: service_healthy
      identidad:
        condition: service_started
      academica:
        condition: service_started
    networks:
      - sigedu-network

  mensajeria:
    build: ./mensajeria
    container_name: sigedu-mensajeria
    ports:
      - "8089:8089"
    environment:
      SERVER_PORT: 8089
      DB_URL: jdbc:mysql://mysql:3306/mensajeria?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
      DB_USER: root
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      IDENTIDAD_URL: http://identidad:8080
    depends_on:
      mysql:
        condition: service_healthy
      identidad:
        condition: service_started
    networks:
      - sigedu-network

volumes:
  sigedu-mysql-data:

networks:
  sigedu-network:
    driver: bridge
