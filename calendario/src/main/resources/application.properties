spring.application.name=calendario
server.port=8084
spring.config.import=optional:file:.env[.properties],optional:file:calendario/.env[.properties]

# Configuracion por entorno (local por defecto)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/identidad?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USER:identificacion}
spring.datasource.password=${DB_PASSWORD:dev_password_change_me}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=${JPA_SHOW_SQL:true}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# Secreto compartido con MS0 Identidad para validar JWT
jwt.secreto=${JWT_SECRET:dev-secret-change-me-32-bytes-minimum}
