spring.application.name=matricula_microservice
spring.web.error.include-binding-errors=always
spring.web.error.include-message=always

spring.config.import=optional:file:.env[.properties],optional:file:matricula/.env[.properties]

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/identidad?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USER:identificacion}
spring.datasource.password=${DB_PASSWORD:dev_password_change_me}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=${JPA_SHOW_SQL:true}

spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.maximum-pool-size=10
springdoc.swagger-ui.path=/matricula.html
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.operations-sorter=alpha
springdoc.api-docs.enabled=true
server.port=8088

# Secreto compartido con MS0 Identidad para validar JWT
jwt.secreto=${JWT_SECRET:dev-secret-change-me-32-bytes-minimum}