spring.application.name=matricula_microservice
spring.web.error.include-binding-errors=always
spring.web.error.include-message=always

spring.config.import=optional:file:.env[.properties],optional:file:matricula/.env[.properties]

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/matricula?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=${JPA_SHOW_SQL:true}

spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.maximum-pool-size=10
server.port=${SERVER_PORT:8088}

# Conexi?n a MS9 Acad?mica - puerto a puerto
# TODO-PUERTO-MS9: actualizar en Docker con nombre de servicio
microservices.academica.url=${MS_ACADEMICA_URL:http://localhost:8083}

# URL MS0 Identidad - puerto a puerto
# TODO-PUERTO-MS0: actualizar en Docker con nombre de servicio
identidad.url=${IDENTIDAD_URL:http://localhost:8080}

springdoc.swagger-ui.path=/swagger-ui/index.html
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.operations-sorter=alpha
springdoc.api-docs.enabled=true
